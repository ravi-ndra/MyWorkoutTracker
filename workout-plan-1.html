<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohan's Build — Training &amp; Nutrition System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#121110;
  --bg-alt:#181614;
  --surface:#1E1B18;
  --surface-2:#272320;
  --line:#3A342C;
  --line-soft:#2A2622;
  --brass:#C99A3B;
  --brass-light:#E3B75C;
  --brass-dim:#8A6B2C;
  --oxide:#B3452C;
  --oxide-light:#D3684B;
  --olive:#7C8C5E;
  --olive-light:#9BAD79;
  --slate:#6E7C89;
  --chalk:#EDE8DE;
  --chalk-dim:#B7B0A2;
  --chalk-faint:#877F72;
  --ink:#0B0A09;
  --radius:3px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --sidebar-w:272px;
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--chalk);
  font-family:'Work Sans',sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--chalk);}
p{margin:0 0 .8em;}
p:last-child{margin-bottom:0;}
a{color:var(--brass-light);}
ul,ol{margin:0;padding-left:1.2em;}
button{font-family:inherit;}
.mono{font-family:'IBM Plex Mono',monospace;}

::selection{background:var(--brass);color:var(--ink);}

*:focus-visible{outline:2px solid var(--brass-light);outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}

/* faint iron texture on the base */
body{
  background-image:
    radial-gradient(circle at 15% 10%, rgba(201,154,59,.05), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(179,69,44,.05), transparent 45%);
  background-attachment:fixed;
}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.app{display:flex;min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-alt);
  border-right:1px solid var(--line-soft);
  position:fixed;
  top:0;left:0;bottom:0;
  overflow-y:auto;
  z-index:50;
  transition:transform .28s ease;
}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

.brand{
  padding:26px 22px 18px;
  border-bottom:1px solid var(--line-soft);
}
.brand-mark{
  display:flex;align-items:center;gap:10px;
}
.brand-plates{display:flex;gap:3px;}
.brand-plates span{width:6px;height:22px;background:var(--brass);border-radius:1px;}
.brand-plates span:nth-child(2){height:16px;background:var(--oxide);}
.brand-plates span:nth-child(3){height:26px;}
.brand-name{font-family:'Anton',sans-serif;font-size:1.25rem;letter-spacing:.03em;line-height:1;}
.brand-sub{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--chalk-dim);letter-spacing:.08em;margin-top:6px;text-transform:uppercase;}

.nav{padding:14px 12px 40px;}
.nav-group{margin-bottom:6px;}
.nav-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:.65rem;
  letter-spacing:.14em;
  color:var(--chalk-faint);
  text-transform:uppercase;
  padding:14px 10px 6px;
}
.nav-link{
  display:flex;align-items:center;gap:10px;
  width:100%;
  padding:9px 10px;
  border:none;background:none;
  color:var(--chalk-dim);
  font-family:'Work Sans',sans-serif;
  font-size:.87rem;
  font-weight:500;
  text-align:left;
  border-left:2px solid transparent;
  border-radius:0 var(--radius) var(--radius) 0;
  cursor:pointer;
  transition:background .15s, color .15s, border-color .15s;
}
.nav-link:hover{background:var(--surface);color:var(--chalk);}
.nav-link.active{
  background:linear-gradient(90deg, rgba(201,154,59,.14), transparent);
  border-left-color:var(--brass);
  color:var(--brass-light);
}
.nav-num{
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;
  color:var(--chalk-faint);
  width:18px;flex-shrink:0;
}
.nav-link.active .nav-num{color:var(--brass);}
.nav-plate{
  display:inline-flex;gap:2px;flex-shrink:0;
}
.nav-plate i{width:3px;height:12px;background:var(--line);border-radius:1px;}
.nav-link.active .nav-plate i{background:var(--brass-dim);}

.sidebar-foot{
  padding:16px 22px 22px;
  border-top:1px solid var(--line-soft);
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;
  color:var(--chalk-faint);
  letter-spacing:.04em;
}

.content{
  margin-left:var(--sidebar-w);
  flex:1;
  min-width:0;
  padding:0 0 80px;
}

.topbar{
  display:none;
  align-items:center;
  gap:14px;
  padding:14px 18px;
  background:var(--bg-alt);
  border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;z-index:40;
}
.menu-toggle{
  width:38px;height:38px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:var(--radius);
  color:var(--chalk);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.menu-toggle span{display:block;width:16px;height:2px;background:var(--chalk);position:relative;}
.menu-toggle span::before,.menu-toggle span::after{content:"";position:absolute;left:0;width:16px;height:2px;background:var(--chalk);}
.menu-toggle span::before{top:-5px;}
.menu-toggle span::after{top:5px;}
.topbar-title{font-family:'Anton',sans-serif;font-size:1rem;letter-spacing:.03em;text-transform:uppercase;}

.overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.55);
  z-index:45;
}

.panel-wrap{padding:38px 44px;max-width:1180px;}

.panel{display:none;animation:fadeIn .3s ease;}
.panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ============================================================
   SHARED COMPONENTS
   ============================================================ */
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;
  letter-spacing:.16em;
  color:var(--brass);
  text-transform:uppercase;
  margin-bottom:8px;
  display:flex;align-items:center;gap:10px;
}
.eyebrow .rule{flex:0 0 30px;height:1px;background:var(--brass-dim);}

.page-head{margin-bottom:30px;}
.page-title{font-size:clamp(1.7rem,3.4vw,2.5rem);}
.page-desc{color:var(--chalk-dim);margin-top:8px;max-width:640px;font-size:.95rem;}

.card{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:20px 22px;
}
.card + .card{margin-top:16px;}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.stat-card{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:16px 18px;
  border-top:2px solid var(--brass-dim);
}
.stat-label{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.1em;color:var(--chalk-faint);text-transform:uppercase;}
.stat-value{font-family:'Anton',sans-serif;font-size:1.5rem;margin-top:6px;color:var(--brass-light);}
.stat-value small{font-family:'Work Sans',sans-serif;font-size:.6em;color:var(--chalk-dim);text-transform:none;letter-spacing:0;margin-left:4px;}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;
  border:1px solid var(--line);
  border-radius:20px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;
  letter-spacing:.03em;
  color:var(--chalk-dim);
  background:var(--surface-2);
}
.pill.brass{border-color:var(--brass-dim);color:var(--brass-light);}
.pill.oxide{border-color:var(--oxide);color:var(--oxide-light);}
.pill.olive{border-color:var(--olive);color:var(--olive-light);}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;
  border-radius:var(--radius);
  border:1px solid var(--brass-dim);
  background:transparent;
  color:var(--brass-light);
  font-weight:600;
  font-size:.82rem;
  letter-spacing:.03em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.btn:hover{background:var(--brass);color:var(--ink);}
.btn.solid{background:var(--brass);color:var(--ink);}
.btn.solid:hover{background:var(--brass-light);}
.btn.ghost{border-color:var(--line);color:var(--chalk-dim);}
.btn.ghost:hover{background:var(--surface-2);color:var(--chalk);}
.btn.small{padding:6px 12px;font-size:.72rem;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

.callout{
  border-left:3px solid var(--oxide);
  background:linear-gradient(90deg, rgba(179,69,44,.08), transparent);
  padding:12px 16px;
  border-radius:0 var(--radius) var(--radius) 0;
  font-size:.87rem;
  color:var(--chalk-dim);
  margin:16px 0;
}
.callout strong{color:var(--oxide-light);}
.callout.olive{border-left-color:var(--olive);background:linear-gradient(90deg, rgba(124,140,94,.08), transparent);}
.callout.olive strong{color:var(--olive-light);}
.callout.brass{border-left-color:var(--brass);background:linear-gradient(90deg, rgba(201,154,59,.08), transparent);}
.callout.brass strong{color:var(--brass-light);}

.quote{
  font-family:'Anton',sans-serif;
  font-size:clamp(1.1rem,2vw,1.5rem);
  text-transform:uppercase;
  color:var(--brass-light);
  text-align:center;
  padding:26px 10px;
  letter-spacing:.02em;
  line-height:1.35;
}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;min-width:640px;font-size:.86rem;}
thead th{
  text-align:left;
  font-family:'IBM Plex Mono',monospace;
  font-size:.66rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--chalk-faint);
  padding:10px 14px;
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td{
  padding:11px 14px;
  border-bottom:1px solid var(--line-soft);
  vertical-align:top;
  color:var(--chalk-dim);
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(201,154,59,.04);}
td.ex-name{color:var(--chalk);font-weight:600;}
td.mono{font-family:'IBM Plex Mono',monospace;color:var(--brass-light);white-space:nowrap;}
td.ex-notes{color:var(--chalk-faint);font-size:.82rem;max-width:280px;}
.chk-cell{width:36px;text-align:center;}
input[type=checkbox]{
  width:17px;height:17px;
  accent-color:var(--brass);
  cursor:pointer;
}
tr.done td{opacity:.45;text-decoration:line-through;}

/* plate loader signature component */
.loader-row{display:flex;align-items:center;gap:14px;margin-top:6px;flex-wrap:wrap;}
.progress-plates{display:flex;gap:3px;align-items:flex-end;height:24px;flex:1;min-width:140px;max-width:260px;}
.progress-plates .plate{flex:1;border:1.5px solid var(--line);border-radius:2px;background:transparent;transition:background .2s,border-color .2s;}
.progress-plates .plate.filled{background:var(--brass);border-color:var(--brass);}
.progress-plates .plate:nth-child(3n+1){height:100%;}
.progress-plates .plate:nth-child(3n+2){height:78%;}
.progress-plates .plate:nth-child(3n){height:60%;}
.pct-label{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--chalk-dim);white-space:nowrap;}

/* day panel header */
.day-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:1px solid var(--line-soft);margin-bottom:22px;
}
.day-number{
  font-family:'Anton',sans-serif;
  font-size:3.4rem;
  color:var(--brass-dim);
  line-height:.85;
}
@supports (-webkit-text-stroke: 1px black){
  .day-number{ color:transparent; -webkit-text-stroke:1.4px var(--brass-dim); }
}
.day-titles .eyebrow{margin-bottom:4px;}
.day-titles h2{font-size:clamp(1.5rem,3vw,2.1rem);}
.day-sub{color:var(--brass-light);font-family:'IBM Plex Mono',monospace;font-size:.82rem;letter-spacing:.05em;margin-top:4px;text-transform:uppercase;}

.meta-strip{display:flex;flex-wrap:wrap;gap:10px 26px;margin:18px 0 6px;}
.meta-item{min-width:110px;}
.meta-item .stat-label{margin-bottom:4px;}
.meta-item .stat-value{font-size:1rem;color:var(--chalk);font-family:'Work Sans',sans-serif;font-weight:600;text-transform:none;}

.section-label{
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--chalk-faint);margin:26px 0 10px;display:flex;align-items:center;gap:10px;
}
.section-label .rule{flex:1;height:1px;background:var(--line);}

.finisher-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.finisher-chip{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 14px;font-size:.83rem;color:var(--chalk-dim);
}
.finisher-chip b{color:var(--chalk);}

/* nav groups for morning/day7 layouts */
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:10px;}

/* nutrition */
.macro-tool{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center;}
@media(max-width:700px){.macro-tool{grid-template-columns:1fr;}}
.macro-input label{display:block;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;color:var(--chalk-faint);text-transform:uppercase;margin-bottom:8px;}
.macro-input input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--chalk);
  padding:11px 12px;border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;font-size:1.1rem;
}
.macro-results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:700px){.macro-results{grid-template-columns:1fr 1fr;}}
.macro-box{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;}
.macro-box .stat-value{font-size:1.35rem;}

.meal-card{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;}
.meal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.meal-time{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--brass);letter-spacing:.06em;text-transform:uppercase;}
.meal-name{font-weight:700;color:var(--chalk);font-size:.98rem;}
.meal-macros{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--chalk-faint);white-space:nowrap;}
.meal-items{margin-top:8px;color:var(--chalk-dim);font-size:.86rem;}
.meal-items ul{padding-left:1.1em;}
.meal-items li{margin-bottom:2px;}

/* tracker */
.tracker-form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
@media(max-width:900px){.tracker-form{grid-template-columns:repeat(3,1fr);}}
@media(max-width:560px){.tracker-form{grid-template-columns:1fr 1fr;}}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:.63rem;letter-spacing:.06em;color:var(--chalk-faint);text-transform:uppercase;margin-bottom:6px;}
.field input,.field select{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--chalk);
  padding:9px 10px;border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;font-size:.85rem;
}
.field-full{grid-column:1/-1;}

.water-tracker{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.water-fill{width:60px;height:90px;border:2px solid var(--line);border-radius:4px 4px 8px 8px;position:relative;overflow:hidden;background:var(--surface-2);flex-shrink:0;}
.water-fill-inner{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--slate),#4c5964);transition:height .3s ease;height:0%;}
.water-label{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--chalk-dim);}

.empty-state{
  text-align:center;padding:34px 16px;color:var(--chalk-faint);font-size:.86rem;
  border:1px dashed var(--line);border-radius:var(--radius);
}

footer.page-foot{
  margin-top:40px;padding-top:20px;border-top:1px solid var(--line-soft);
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--chalk-faint);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
}

/* overview hero */
.hero{
  display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;margin-bottom:30px;
}
@media(max-width:900px){.hero{grid-template-columns:1fr;}}
.hero-title{font-size:clamp(2.1rem,5vw,3.4rem);line-height:.98;}
.hero-title .accent{color:var(--brass-light);}
.hero-sub{color:var(--chalk-dim);margin-top:14px;max-width:480px;}
.hero-plates{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:20px;
}
.week-row{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:14px;}
.week-day{flex:1;text-align:center;}
.week-day .lbl{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--chalk-faint);letter-spacing:.06em;}
.week-day .bar{
  width:100%;height:60px;margin:6px 0;border-radius:2px;
  background:var(--surface-2);border:1px solid var(--line-soft);
  display:flex;align-items:flex-end;overflow:hidden;
}
.week-day .bar i{width:100%;background:var(--brass-dim);display:block;}
.week-day.rest .bar i{background:var(--line);}
.week-day .tag{font-size:.62rem;color:var(--chalk-faint);}

.phase-track{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px;}
@media(max-width:700px){.phase-track{grid-template-columns:1fr 1fr;}}
.phase-card{background:var(--surface-2);border:1px solid var(--line-soft);border-top:2px solid var(--brass-dim);border-radius:var(--radius);padding:14px;}
.phase-card .stat-label{color:var(--brass-light);}
.phase-card ul{margin-top:8px;padding-left:1.1em;font-size:.82rem;color:var(--chalk-dim);}
.phase-card li{margin-bottom:3px;}

/* ============================================================
   SESSION LOGGING — timer, set/rep/weight cards, rest timer
   ============================================================ */
.log-details{
  margin-top:20px;border:1px solid var(--brass-dim);border-radius:var(--radius);
  background:var(--surface);overflow:hidden;
}
.log-details summary{
  cursor:pointer;list-style:none;padding:14px 18px;
  font-family:'IBM Plex Mono',monospace;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--brass-light);display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface-2);
}
.log-details summary::-webkit-details-marker{display:none;}
.log-details summary::after{content:"+";font-family:'Anton',sans-serif;font-size:1.15rem;color:var(--chalk-faint);flex-shrink:0;}
.log-details[open] summary::after{content:"\2013";}
.timer-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--line-soft);
}
.timer-display{font-family:'IBM Plex Mono',monospace;font-size:1.15rem;color:var(--brass-light);min-width:56px;}
.log-date{background:var(--surface-2);border:1px solid var(--line);color:var(--chalk);padding:8px 10px;border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;font-size:.78rem;}
.log-grid{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.log-card{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px 14px;}
.log-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}

/* ---- persistence: uses the artifact storage API when available (persists
   across visits inside Claude), and falls back to plain in-memory state
   when this file is opened as a standalone HTML page. ---- */
async function storageGet(key){
  try{
    if(typeof window.storage === 'undefined') return null;
    const res = await window.storage.get(key, false);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(typeof window.storage === 'undefined') return false;
    await window.storage.set(key, JSON.stringify(value), false);
    return true;
  }catch(e){ return false; }
}
async function loadPersisted(){
  const ws = await storageGet('workout-sessions');
  if(Array.isArray(ws)) SESSION_LOG = ws;

function renderPlateLoader(container, percent){
  container.innerHTML='';
  const total=10, filled=Math.round((percent/100)*total);
  for(let i=0;i<total;i++){
    const p=document.createElement('div');
    p.className='plate'+(i<filled?' filled':'');
    container.appendChild(p);
  }
}

/* ---- session timer ---- */
function startTimer(dayKey){
  if(DAY_TIMERS[dayKey] && DAY_TIMERS[dayKey].startTs) return;
  DAY_TIMERS[dayKey] = { startTs: Date.now(), intervalId: null };
  const btn = document.getElementById('start-btn-'+dayKey);
  if(btn){ btn.textContent = 'Running…'; btn.disabled = true; }
  DAY_TIMERS[dayKey].intervalId = setInterval(()=>updateTimerDisplay(dayKey), 1000);
  updateTimerDisplay(dayKey);
}
function updateTimerDisplay(dayKey){
  const state = DAY_TIMERS[dayKey];
  if(!state || !state.startTs) return;
  const elapsed = Date.now() - state.startTs;
  const mins = Math.floor(elapsed/60000);
  const secs = Math.floor((elapsed%60000)/1000);
  const disp = document.getElementById('timer-display-'+dayKey);
  if(disp) disp.textContent = String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
}
function stopTimerAndGetDuration(dayKey){
  const state = DAY_TIMERS[dayKey];
  if(!state || !state.startTs) return null;
  clearInterval(state.intervalId);
  const elapsedMs = Date.now() - state.startTs;
  DAY_TIMERS[dayKey] = { startTs:null, intervalId:null };
  const btn = document.getElementById('start-btn-'+dayKey);
  if(btn){ btn.textContent = 'Start Workout'; btn.disabled = false; }
  const disp = document.getElementById('timer-display-'+dayKey);
  if(disp) disp.textContent = '00:00';
  return Math.max(1, Math.round(elapsedMs/60000));
}

/* ---- rest timer (per exercise, reads its prescribed rest string) ---- */
function startRestTimer(btn, restStr){
  if(btn.dataset.running === '1') return;
  const match = restStr.match(/\d+/g);
  if(!match) return;
  let seconds = parseInt(match[match.length-1], 10); // use the upper bound, e.g. "60–90 sec" -> 90
  const original = btn.textContent;
  btn.dataset.running = '1';
  btn.classList.add('active');
  let iv = null;
  function tick(){
    btn.textContent = '⏱ '+seconds+'s';
    if(seconds<=0){
      if(iv) clearInterval(iv);
      btn.textContent = original;
      btn.classList.remove('active');
      btn.dataset.running = '0';
      return;
    }
    seconds--;
  }
  tick();
  iv = setInterval(tick, 1000);
}

/* ---- copy first set's weight down to empty sets for the same exercise ---- */
function copyFirstSet(dayKey, exIdx){
  const weightInputs = document.querySelectorAll(`.log-weight[data-day="${dayKey}"][data-ex="${exIdx}"]`);
  if(!weightInputs.length || !weightInputs[0].value) return;
  const firstVal = weightInputs[0].value;
  weightInputs.forEach(inp=>{ if(!inp.value) inp.value = firstVal; });
}

/* ---- save a logged session (sets/reps/weight + duration) ---- */
function saveSession(dayKey){
  const day = DAY_DATA[dayKey];
  const durationMin = stopTimerAndGetDuration(dayKey);
  const dateEl = document.getElementById('log-date-'+dayKey);
  const dateVal = (dateEl && dateEl.value) ? dateEl.value : TODAY_STR;
  const entries = [];
  day.exercises.forEach((ex, idx)=>{
    for(let s=0; s<ex.sets; s++){
      const wEl = document.querySelector(`.log-weight[data-day="${dayKey}"][data-ex="${idx}"][data-set="${s}"]`);
      const rEl = document.querySelector(`.log-reps[data-day="${dayKey}"][data-ex="${idx}"][data-set="${s}"]`);
      const w = wEl ? wEl.value.trim() : '';
      const r = rEl ? rEl.value.trim() : '';
      if(w || r){ entries.push({exercise: ex.name, set: s+1, weight: w || '—', reps: r || '—'}); }
    }
  });
  if(!entries.length){
    alert('Log at least one set (weight or reps) before saving.');
    return;
  }
  const session = {
    id: 'sess-'+Date.now(),
    date: dateVal,
    dayKey: dayKey,
    dayTitle: day.title+' — '+day.subtitle,
    duration: durationMin!=null ? durationMin+' min' : '—',
    entries: entries,
  };
  SESSION_LOG.unshift(session);
  storageSet('workout-sessions', SESSION_LOG);
  document.querySelectorAll(`.log-weight[data-day="${dayKey}"], .log-reps[data-day="${dayKey}"]`).forEach(i=>i.value='');
  renderSessionHistory();
  showToast(entries.length+' sets saved to your workout log.');
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast'; t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimeout);
  window.__toastTimeout = setTimeout(()=>t.classList.remove('show'), 2800);
}

      <div class="stat-card"><div class="stat-label">Water</div><div class="stat-value">3–4 <small>L</small></div></div>
      <div class="stat-card"><div class="stat-label">Sleep</div><div class="stat-value">7.5–9 <small>hrs</small></div></div>
      <div class="stat-card"><div class="stat-label">Protein Sources</div><div class="stat-value" style="font-size:.85rem;">Milk · Soy · Paneer · Dal · Soya Chunks</div></div>
      <div class="stat-card"><div class="stat-label">Weight Gain Pace</div><div class="stat-value">0.25–0.5 <small>kg/wk</small></div></div>
    </div>
  `;

  const bwInput = document.getElementById('bwInput');
  function renderMacros(){
    const bw = parseFloat(bwInput.value)||65;
    const t = macroTargets(bw);
    document.getElementById('macroResults').innerHTML = `
      <div class="macro-box"><div class="stat-label">Calories</div><div class="stat-value">${t.kcal}</div></div>
      <div class="macro-box"><div class="stat-label">Protein</div><div class="stat-value">${t.protein}<small>g</small></div></div>
      <div class="macro-box"><div class="stat-label">Carbs</div><div class="stat-value">${t.carb}<small>g</small></div></div>
      <div class="macro-box"><div class="stat-label">Fat</div><div class="stat-value">${t.fat}<small>g</small></div></div>
    `;
  }
  bwInput.addEventListener('input', renderMacros);
  renderMacros();
}

/* ============================================================
   TRACKER
   ============================================================ */
let TRACKER_ENTRIES = [];
let WATER_ML = 0;
const WATER_TARGET = 3500;

function buildTracker(){
  const storageAvailable = typeof window.storage !== 'undefined';
  document.getElementById('panel-tracker').innerHTML = `
    <div class="page-head">
      <div class="eyebrow"><span class="rule"></span>Tools</div>
      <h2 class="page-title">Progress Tracker</h2>
      <p class="page-desc">${storageAvailable
        ? 'Your workout and body logs save automatically as you use this. Export CSV any time you want a copy on your phone.'
        : "This file is running standalone, so logs stay in memory only for this browser tab — export CSV before you close it to keep a permanent record."}</p>
    </div>

    <div class="section-label">Workout Session Log<span class="rule"></span></div>
    <div class="card">
      <p style="color:var(--chalk-dim);font-size:.86rem;margin-bottom:12px;">Every set you log on a gym day (weight × reps, per exercise) lands here automatically.</p>
      <div id="sessionHistoryWrap"></div>
      <div class="btn-row">
        <button class="btn ghost" onclick="exportWorkoutCSV()">Export Workout CSV</button>
        <button class="btn ghost" onclick="clearSessions()">Clear Sessions</button>
      </div>
    </div>

    <div class="section-label">Body Stats<span class="rule"></span></div>
    <div class="card">
      <h3 style="font-size:.95rem;font-family:'Work Sans';letter-spacing:.02em;margin-bottom:12px;">Water Intake</h3>
      <div class="water-tracker">
        <div class="water-fill"><div class="water-fill-inner" id="waterFillInner"></div></div>
        <div>
          <div class="water-label" id="waterLabel">0 / 3500 ml</div>
          <div class="btn-row">
            <button class="btn small" onclick="addWater(250)">+250 ml</button>
            <button class="btn small" onclick="addWater(500)">+500 ml</button>
            <button class="btn ghost small" onclick="addWater(-250)">−250 ml</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:.95rem;font-family:'Work Sans';letter-spacing:.02em;margin-bottom:14px;">Add Today's Log</h3>
      <div class="tracker-form">
        <div class="field"><label>Date</label><input type="date" id="tDate"></div>
        <div class="field"><label>Weight (kg)</label><input type="number" step="0.1" id="tWeight" placeholder="65.0"></div>
        <div class="field"><label>Chest (cm)</label><input type="number" step="0.1" id="tChest" placeholder="—"></div>
        <div class="field"><label>Waist (cm)</label><input type="number" step="0.1" id="tWaist" placeholder="—"></div>
        <div class="field"><label>Arm (cm)</label><input type="number" step="0.1" id="tArm" placeholder="—"></div>
        <div class="field"><label>Sleep (hrs)</label><input type="number" step="0.5" id="tSleep" placeholder="8"></div>
        <div class="field"><label>Energy (1–10)</label><input type="number" min="1" max="10" id="tEnergy" placeholder="7"></div>
        <div class="field"><label>Workout Done</label><select id="tDone"><option value="Yes">Yes</option><option value="No">No</option></select></div>
        <div class="field field-full"><label>Notes</label><input type="text" id="tNotes" placeholder="How did today's session feel?"></div>
      </div>
      <div class="btn-row">
        <button class="btn solid" onclick="addEntry()">Add Entry</button>
        <button class="btn ghost" onclick="exportCSV()">Export CSV</button>
        <button class="btn ghost" onclick="clearEntries()">Clear All</button>
      </div>
    </div>

    <div class="section-label">Log History<span class="rule"></span></div>
    <div id="trackerTableWrap"></div>
  `;
  const dEl = document.getElementById('tDate');
  if(dEl) dEl.value = TODAY_STR;
  renderWater();
  renderTrackerTable();
  renderSessionHistory();
}

function addWater(ml){
  WATER_ML = Math.max(0, WATER_ML+ml);
  renderWater();
}
function renderWater(){
  const pct = Math.min(100, Math.round((WATER_ML/WATER_TARGET)*100));
  const fillEl = document.getElementById('waterFillInner');
  if(fillEl) fillEl.style.height = pct+'%';
  const lbl = document.getElementById('waterLabel');
  if(lbl) lbl.textContent = `${WATER_ML} / ${WATER_TARGET} ml`;
}

function addEntry(){
  const entry = {
    date: document.getElementById('tDate').value || new Date().toISOString().slice(0,10),
    weight: document.getElementById('tWeight').value || '—',
    chest: document.getElementById('tChest').value || '—',
    waist: document.getElementById('tWaist').value || '—',
    arm: document.getElementById('tArm').value || '—',
    sleep: document.getElementById('tSleep').value || '—',
    energy: document.getElementById('tEnergy').value || '—',
    done: document.getElementById('tDone').value,
    notes: document.getElementById('tNotes').value || '',
  };
  TRACKER_ENTRIES.unshift(entry);
  storageSet('body-log', TRACKER_ENTRIES);
  renderTrackerTable();
  document.getElementById('tNotes').value='';
}

function clearEntries(){
  if(TRACKER_ENTRIES.length && !confirm('Clear all logged entries? Export first if you want to keep them.')) return;
  TRACKER_ENTRIES = [];
  storageSet('body-log', TRACKER_ENTRIES);
  renderTrackerTable();
}

function renderTrackerTable(){
  const wrap = document.getElementById('trackerTableWrap');
  if(!wrap) return;
  if(!TRACKER_ENTRIES.length){
    wrap.innerHTML = `<div class="empty-state">No entries yet. Add today's numbers above — even just weight and sleep is useful over time.</div>`;
    return;
  }
  const rows = TRACKER_ENTRIES.map(e=>`
    <tr>
      <td class="mono">${e.date}</td><td class="mono">${e.weight}</td><td class="mono">${e.chest}</td>
      <td class="mono">${e.waist}</td><td class="mono">${e.arm}</td><td class="mono">${e.sleep}</td>
      <td class="mono">${e.energy}</td><td>${e.done}</td><td class="ex-notes">${e.notes}</td>
    </tr>`).join('');
  wrap.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Wt(kg)</th><th>Chest</th><th>Waist</th><th>Arm</th><th>Sleep</th><th>Energy</th><th>Done</th><th>Notes</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function exportCSV(){
  if(!TRACKER_ENTRIES.length){ alert('No entries to export yet.'); return; }
  const header = ['Date','Weight(kg)','Chest(cm)','Waist(cm)','Arm(cm)','Sleep(hrs)','Energy','WorkoutDone','Notes'];
  const rows = TRACKER_ENTRIES.map(e=>[e.date,e.weight,e.chest,e.waist,e.arm,e.sleep,e.energy,e.done,`"${(e.notes||'').replace(/"/g,'""')}"`]);
  const csv = [header.join(','), ...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `progress-log-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderSessionHistory(){
  const wrap = document.getElementById('sessionHistoryWrap');
  if(!wrap) return;
  if(!SESSION_LOG.length){
    wrap.innerHTML = `<div class="empty-state">No sessions logged yet. Open any gym day, expand "Log This Session," and hit Save Session once you're done.</div>`;
    return;
  }
  const rows = SESSION_LOG.map(sess=>{
    const details = sess.entries.map(e=>`${e.exercise} — Set ${e.set}: ${e.weight} kg × ${e.reps}`).join('<br>');
    return `<tr>
      <td class="mono">${sess.date}</td>
      <td class="ex-name">${sess.dayTitle}</td>
      <td class="mono">${sess.duration}</td>
      <td class="ex-notes">${details}</td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Session</th><th>Duration</th><th>Sets Logged</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function clearSessions(){
  if(SESSION_LOG.length && !confirm('Clear all workout session logs? Export first if you want to keep them.')) return;
  SESSION_LOG = [];
  storageSet('workout-sessions', SESSION_LOG);
  renderSessionHistory();
}

function exportWorkoutCSV(){
  if(!SESSION_LOG.length){ alert('No sessions to export yet.'); return; }
  const header = ['Date','Session','Duration','Exercise','Set','Weight(kg)','Reps'];
  const rows = [];
  SESSION_LOG.forEach(sess=>{
    sess.entries.forEach(e=>{
      rows.push([sess.date, `"${sess.dayTitle}"`, sess.duration, `"${e.exercise}"`, e.set, e.weight, e.reps]);
    });
  });
  const csv = [header.join(','), ...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `workout-log-${TODAY_STR}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function buildNav(){
  const navEl = document.getElementById('nav');
  navEl.innerHTML = NAV.map(g=>`
    <div class="nav-group">
      <div class="nav-title">${g.group}</div>
      ${g.items.map(it=>`
        <button class="nav-link" data-target="${it.id}">
          <span class="nav-num">${it.num}</span>
          <span>${it.label}</span>
        </button>`).join('')}
    </div>`).join('');

  navEl.querySelectorAll('.nav-link').forEach(btn=>{
    btn.addEventListener('click', ()=> showPanel(btn.dataset.target));
  });
}

function showPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active', b.dataset.target===id));
  const label = document.querySelector(`.nav-link[data-target="${id}"] span:last-child`);
  document.getElementById('topbarTitle').textContent = label ? label.textContent : 'The Build';
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  window.scrollTo(0,0);
}

function setupMobileNav(){
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const toggle = document.getElementById('menuToggle');
  toggle.addEventListener('click', ()=>{
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', ()=>{
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  buildNav();
  buildOverview();
  buildSchedule();
  buildDayPanels();
  buildDay7();
  buildMorning();
  buildPrinciples();
  buildNutrition();
  await loadPersisted();
  buildTracker();
  setupMobileNav();
  showPanel('overview');
}
document.addEventListener('DOMContentLoaded', init);
</script>
