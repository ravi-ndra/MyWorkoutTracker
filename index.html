<style>
/* ============================================================
   TOKENS — light, minimal, warm-coral fitness app aesthetic
   ============================================================ */
:root{
  --bg:#F5F2EC;
  --bg-alt:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F6F3ED;
  --line:#ECE7DD;
  --line-soft:#F1EDE5;
  --coral:#FF6B4A;
  --coral-light:#FF8B6E;
  --coral-dim:#FFE3D9;
  --coral-deep:#DE4E2F;
  --brass:#FF6B4A;        /* legacy alias, now maps to coral accent */
  --brass-light:#FF8B6E;
  --brass-dim:#F7B39F;
  --oxide:#E0523A;
  --oxide-light:#DE4E2F;
  --olive:#2FAE7D;
  --olive-light:#1F9068;
  --slate:#4C8FCF;
  --chalk:#211D18;
  --chalk-dim:#6F695F;
  --chalk-faint:#9A9284;
  --ink:#211D18;
  --white:#FFFFFF;
  --radius:18px;
  --radius-sm:12px;
  --radius-pill:999px;
  --shadow:0 2px 8px rgba(40,32,20,.05), 0 10px 28px rgba(40,32,20,.06);
  --shadow-lg:0 16px 44px rgba(40,32,20,.14);
  --sidebar-w:272px;
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--chalk-dim);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
p{margin:0 0 .8em;}
p:last-child{margin-bottom:0;}
a{color:var(--coral-deep);}
ul,ol{margin:0;padding-left:1.2em;}
button{font-family:inherit;}
.mono{font-family:'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums;font-weight:700;}

::selection{background:var(--coral-dim);color:var(--coral-deep);}

*:focus-visible{outline:2px solid var(--coral);outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}

body{
  background-image:radial-gradient(circle at 12% -4%, rgba(255,107,74,.07), transparent 42%);
  background-attachment:fixed;
}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.app{display:flex;min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-alt);
  border-right:1px solid var(--line);
  position:fixed;
  top:0;left:0;bottom:0;
  overflow-y:auto;
  z-index:50;
  transition:transform .28s ease;
}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

.brand{
  padding:24px 22px 18px;
  border-bottom:1px solid var(--line);
}
.brand-mark{
  display:flex;align-items:center;gap:10px;
}
.brand-plates{
  display:flex;gap:3px;align-items:flex-end;
  background:var(--coral);border-radius:10px;padding:8px 7px;
}
.brand-plates span{width:5px;height:16px;background:rgba(255,255,255,.55);border-radius:2px;}
.brand-plates span:nth-child(2){height:22px;background:#fff;}
.brand-plates span:nth-child(3){height:12px;}
.brand-name{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:-.01em;line-height:1;color:var(--ink);}
.brand-sub{font-family:'Plus Jakarta Sans',sans-serif;font-size:.72rem;color:var(--chalk-faint);letter-spacing:.02em;margin-top:6px;font-weight:600;}

.nav{padding:14px 12px 40px;}
.nav-group{margin-bottom:6px;}
.nav-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.68rem;
  font-weight:700;
  letter-spacing:.1em;
  color:var(--chalk-faint);
  text-transform:uppercase;
  padding:14px 12px 6px;
}
.nav-link{
  display:flex;align-items:center;gap:10px;
  width:100%;
  padding:10px 12px;
  border:none;background:none;
  color:var(--chalk-dim);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.87rem;
  font-weight:600;
  text-align:left;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:background .15s, color .15s;
}
.nav-link:hover{background:var(--surface-2);color:var(--ink);}
.nav-link.active{
  background:var(--coral);
  color:#fff;
  box-shadow:0 4px 14px rgba(255,107,74,.35);
}
.nav-num{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.68rem;
  font-weight:700;
  color:var(--chalk-faint);
  width:18px;flex-shrink:0;
}
.nav-link.active .nav-num{color:rgba(255,255,255,.8);}

.sidebar-foot{
  padding:16px 22px 22px;
  border-top:1px solid var(--line);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.7rem;
  font-weight:600;
  color:var(--chalk-faint);
}

.content{
  margin-left:var(--sidebar-w);
  flex:1;
  min-width:0;
  padding:0 0 80px;
}

.topbar{
  display:none;
  align-items:center;
  gap:14px;
  padding:14px 18px;
  background:var(--bg-alt);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.menu-toggle{
  width:38px;height:38px;
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:var(--radius-sm);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.menu-toggle span{display:block;width:16px;height:2px;background:var(--ink);position:relative;border-radius:2px;}
.menu-toggle span::before,.menu-toggle span::after{content:"";position:absolute;left:0;width:16px;height:2px;background:var(--ink);border-radius:2px;}
.menu-toggle span::before{top:-5px;}
.menu-toggle span::after{top:5px;}
.topbar-title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1rem;color:var(--ink);}

.overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(30,25,18,.35);
  z-index:45;
}

.panel-wrap{padding:38px 44px;max-width:1180px;}

.panel{display:none;animation:fadeIn .3s ease;}
.panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ============================================================
   SHARED COMPONENTS
   ============================================================ */
.eyebrow{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.74rem;
  font-weight:700;
  letter-spacing:.1em;
  color:var(--coral-deep);
  text-transform:uppercase;
  margin-bottom:8px;
  display:flex;align-items:center;gap:10px;
}
.eyebrow .rule{flex:0 0 22px;height:2px;border-radius:2px;background:var(--coral);}

.page-head{margin-bottom:26px;}
.page-title{font-size:clamp(1.6rem,3.2vw,2.3rem);}
.page-desc{color:var(--chalk-dim);margin-top:8px;max-width:640px;font-size:.95rem;}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 24px;
  box-shadow:var(--shadow);
}
.card + .card{margin-top:16px;}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.stat-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.stat-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--chalk-faint);text-transform:uppercase;}
.stat-value{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.5rem;margin-top:6px;color:var(--ink);letter-spacing:-.01em;}
.stat-value small{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:.55em;color:var(--chalk-dim);text-transform:none;letter-spacing:0;margin-left:4px;}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;
  border:1px solid var(--line);
  border-radius:var(--radius-pill);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.72rem;
  font-weight:700;
  color:var(--chalk-dim);
  background:var(--surface-2);
}
.pill.brass{border-color:transparent;color:var(--coral-deep);background:var(--coral-dim);}
.pill.oxide{border-color:transparent;color:#fff;background:var(--oxide);}
.pill.olive{border-color:transparent;color:#fff;background:var(--olive);}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;
  border-radius:var(--radius-pill);
  border:1.5px solid var(--coral);
  background:transparent;
  color:var(--coral-deep);
  font-weight:700;
  font-size:.82rem;
  cursor:pointer;
  transition:background .15s,color .15s,box-shadow .15s;
}
.btn:hover{background:var(--coral-dim);}
.btn.solid{background:var(--coral);color:#fff;border-color:var(--coral);box-shadow:0 6px 16px rgba(255,107,74,.3);}
.btn.solid:hover{background:var(--coral-deep);box-shadow:0 6px 18px rgba(255,107,74,.4);}
.btn.ghost{border-color:var(--line);color:var(--chalk-dim);background:var(--surface);}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);border-color:var(--chalk-faint);}
.btn.small{padding:7px 14px;font-size:.72rem;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

.callout{
  border:1px solid var(--line);
  border-left:4px solid var(--oxide);
  background:var(--surface);
  padding:14px 18px;
  border-radius:var(--radius-sm);
  font-size:.87rem;
  color:var(--chalk-dim);
  margin:16px 0;
  box-shadow:var(--shadow);
}
.callout strong{color:var(--oxide);}
.callout.olive{border-left-color:var(--olive);}
.callout.olive strong{color:var(--olive-light);}
.callout.brass{border-left-color:var(--coral);}
.callout.brass strong{color:var(--coral-deep);}

.quote{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:clamp(1.15rem,2vw,1.5rem);
  color:var(--ink);
  text-align:center;
  padding:28px 14px;
  letter-spacing:-.01em;
  line-height:1.4;
}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);background:var(--surface);}
table{width:100%;border-collapse:collapse;min-width:640px;font-size:.86rem;}
thead th{
  text-align:left;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:.68rem;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--chalk-faint);
  padding:12px 14px;
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td{
  padding:13px 14px;
  border-bottom:1px solid var(--line-soft);
  vertical-align:top;
  color:var(--chalk-dim);
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--coral-dim);}
td.ex-name{color:var(--ink);font-weight:700;}
td.mono{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:var(--coral-deep);white-space:nowrap;}
td.ex-notes{color:var(--chalk-faint);font-size:.82rem;max-width:280px;}
.chk-cell{width:36px;text-align:center;}
input[type=checkbox]{
  width:18px;height:18px;
  accent-color:var(--coral);
  cursor:pointer;
}
tr.done td{opacity:.4;text-decoration:line-through;}

/* progress bar (rounded fill) */
.loader-row{display:flex;align-items:center;gap:14px;margin-top:6px;flex-wrap:wrap;}
.progress-plates{
  flex:1;min-width:140px;max-width:260px;height:10px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-pill);
  overflow:hidden;
}
.progress-plates .bar-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--coral),var(--coral-light));transition:width .3s ease;}
.pct-label{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.75rem;color:var(--chalk-dim);white-space:nowrap;}

/* day panel header */
.day-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;
  padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px;
}
.day-number{
  width:58px;height:58px;flex-shrink:0;
  border-radius:16px;
  background:var(--coral-dim);
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:800;
  font-size:1.4rem;
  color:var(--coral-deep);
  line-height:1;
}
.day-titles .eyebrow{margin-bottom:4px;}
.day-titles h2{font-size:clamp(1.4rem,3vw,2rem);}
.day-sub{color:var(--coral-deep);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.85rem;margin-top:4px;}

.meta-strip{display:flex;flex-wrap:wrap;gap:10px 26px;margin:18px 0 6px;}
.meta-item{min-width:110px;}
.meta-item .stat-label{margin-bottom:4px;}
.meta-item .stat-value{font-size:1rem;color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;}

.section-label{
  font-family:'Plus Jakarta Sans',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--chalk-faint);margin:28px 0 12px;display:flex;align-items:center;gap:10px;
}
.section-label .rule{flex:1;height:1px;background:var(--line);}

.finisher-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.finisher-chip{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 15px;font-size:.83rem;color:var(--chalk-dim);box-shadow:var(--shadow);
}
.finisher-chip b{color:var(--ink);}

/* nav groups for morning/day7 layouts */
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:10px;}

/* nutrition */
.macro-tool{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center;}
@media(max-width:700px){.macro-tool{grid-template-columns:1fr;}}
.macro-input label{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--chalk-faint);text-transform:uppercase;margin-bottom:8px;}
.macro-input input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  padding:12px 14px;border-radius:var(--radius-sm);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.1rem;
}
.macro-results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:700px){.macro-results{grid-template-columns:1fr 1fr;}}
.macro-box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;}
.macro-box .stat-value{font-size:1.35rem;color:var(--coral-deep);}

.meal-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;margin-bottom:10px;box-shadow:var(--shadow);}
.meal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.meal-time{font-family:'Plus Jakarta Sans',sans-serif;font-size:.7rem;font-weight:700;color:var(--coral-deep);letter-spacing:.04em;text-transform:uppercase;}
.meal-name{font-weight:800;color:var(--ink);font-size:.98rem;}
.meal-macros{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.72rem;color:var(--chalk-faint);white-space:nowrap;}
.meal-items{margin-top:8px;color:var(--chalk-dim);font-size:.86rem;}
.meal-items ul{padding-left:1.1em;}
.meal-items li{margin-bottom:2px;}

/* tracker */
.tracker-form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
@media(max-width:900px){.tracker-form{grid-template-columns:repeat(3,1fr);}}
@media(max-width:560px){.tracker-form{grid-template-columns:1fr 1fr;}}
.field label{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.05em;color:var(--chalk-faint);text-transform:uppercase;margin-bottom:6px;}
.field input,.field select{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  padding:10px 11px;border-radius:var(--radius-sm);font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:.85rem;
}
.field-full{grid-column:1/-1;}

.water-tracker{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.water-fill{width:60px;height:90px;border:2px solid var(--line);border-radius:8px 8px 14px 14px;position:relative;overflow:hidden;background:var(--surface-2);flex-shrink:0;}
.water-fill-inner{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,#6EC3E8,#4C8FCF);transition:height .3s ease;height:0%;}
.water-label{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.85rem;color:var(--chalk-dim);}

.empty-state{
  text-align:center;padding:34px 16px;color:var(--chalk-faint);font-size:.86rem;
  border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--surface-2);
}

footer.page-foot{
  margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:.72rem;color:var(--chalk-faint);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
}

/* overview hero */
.hero{
  display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;margin-bottom:30px;
}
@media(max-width:900px){.hero{grid-template-columns:1fr;}}
.hero-title{font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.04;}
.hero-title .accent{color:var(--coral);}
.hero-sub{color:var(--chalk-dim);margin-top:14px;max-width:480px;}
.hero-plates{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.week-row{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:14px;}
.week-day{flex:1;text-align:center;}
.week-day .lbl{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.62rem;color:var(--chalk-faint);letter-spacing:.04em;}
.week-day .bar{
  width:100%;height:60px;margin:6px 0;border-radius:8px;
  background:var(--surface-2);border:1px solid var(--line);
  display:flex;align-items:flex-end;overflow:hidden;
}
.week-day .bar i{width:100%;background:var(--coral);display:block;border-radius:6px 6px 0 0;}
.week-day.rest .bar i{background:var(--line);}
.week-day .tag{font-size:.6rem;color:var(--chalk-faint);font-weight:600;}

.phase-track{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px;}
@media(max-width:700px){.phase-track{grid-template-columns:1fr 1fr;}}
.phase-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--coral);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);}
.phase-card .stat-label{color:var(--coral-deep);}
.phase-card ul{margin-top:8px;padding-left:1.1em;font-size:.82rem;color:var(--chalk-dim);}
.phase-card li{margin-bottom:3px;}

/* ============================================================
   SESSION LOGGING — timer, set/rep/weight cards, rest timer
   ============================================================ */
.log-details{
  margin-top:20px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);overflow:hidden;box-shadow:var(--shadow);
}
.log-details summary{
  cursor:pointer;list-style:none;padding:15px 19px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.02em;
  color:var(--coral-deep);display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface-2);
}
.log-details summary::-webkit-details-marker{display:none;}
.log-details summary::after{content:"+";font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.15rem;color:var(--chalk-faint);flex-shrink:0;}
.log-details[open] summary::after{content:"\2013";}
.timer-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:15px 19px;border-bottom:1px solid var(--line-soft);
}
.timer-display{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.15rem;color:var(--coral-deep);min-width:56px;font-variant-numeric:tabular-nums;}
.log-date{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:var(--radius-sm);font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:.78rem;}
.log-grid{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.log-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;}
.log-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.log-ex-name{font-weight:700;color:var(--ink);font-size:.86rem;}
.log-card-actions{display:flex;gap:8px;align-items:center;}
.rest-timer-btn{
  background:var(--surface);border:1px solid var(--line);color:var(--chalk-dim);
  font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.68rem;padding:6px 12px;border-radius:var(--radius-pill);cursor:pointer;
  white-space:nowrap;
}
.rest-timer-btn.active{border-color:var(--oxide);color:var(--oxide);background:#FFF0EC;}
.set-grid{display:flex;flex-wrap:wrap;gap:10px;}
.set-input{display:flex;flex-direction:column;gap:4px;}
.set-input label{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:.6rem;color:var(--chalk-faint);text-transform:uppercase;}
.set-input input{
  width:66px;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  padding:8px 9px;border-radius:var(--radius-sm);font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:.8rem;
}
.set-input input+input{margin-top:4px;}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:var(--radius-pill);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.01em;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;box-shadow:var(--shadow-lg);
  max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============================================================
   LOG & TRACK — muscle picker, exercise library, chart, photos
   ============================================================ */
.muscle-pills{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px;}
.muscle-pill{
  padding:9px 17px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--chalk-dim);font-family:'Plus Jakarta Sans',sans-serif;font-size:.76rem;font-weight:700;
  cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.muscle-pill:hover{border-color:var(--coral);color:var(--ink);}
.muscle-pill.active{background:var(--coral);color:#fff;border-color:var(--coral);box-shadow:0 4px 12px rgba(255,107,74,.32);}

.equip-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.equip-chip{
  padding:6px 13px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--chalk-faint);font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:.68rem;cursor:pointer;
}
.equip-chip.active{border-color:var(--olive);color:var(--olive-light);background:#E7F7EF;}

.lib-search{
  width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  padding:12px 15px;border-radius:var(--radius-sm);font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:.88rem;
  margin-bottom:16px;
}

.lib-muscle-panel{display:none;}
.lib-muscle-panel.active{display:block;}

.lib-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px 17px;margin-bottom:12px;}

/* ---- persistence: uses Claude's artifact storage API when this page is open
   inside Claude (claude.ai / the app) — your logs then genuinely survive a
   refresh or closing the tab. If you save this file and open it directly in
   your phone's browser instead, storage isn't available there either way
   (this file has no server), so it falls back to in-memory for that session —
   export CSV / download photos to keep a permanent copy in that case. ---- */
async function storageGet(key){
  try{
    if(typeof window.storage === 'undefined') return null;
    const res = await window.storage.get(key, false);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(typeof window.storage === 'undefined') return false;
    await window.storage.set(key, JSON.stringify(value), false);
    return true;
  }catch(e){ return false; }
}
async function storageDelete(key){
  try{
    if(typeof window.storage === 'undefined') return false;
    await window.storage.delete(key, false);
    return true;
  }catch(e){ return false; }
}
async function storageListKeys(prefix){
  try{
    if(typeof window.storage === 'undefined') return [];
    const res = await window.storage.list(prefix, false);
    return (res && res.keys) ? res.keys : [];
  }catch(e){ return []; }
}
async function loadPersisted(){
  const ws = await storageGet('workout-sessions');
  if(Array.isArray(ws)) SESSION_LOG = ws;
  const bl = await storageGet('body-log');
  if(Array.isArray(bl)) TRACKER_ENTRIES = bl;
  try{
    const keys = await storageListKeys('photo:');
    const loaded = [];
    for(const k of keys){
      const v = await storageGet(k);
      if(v) loaded.push(v);
    }
    if(loaded.length){ loaded.sort((a,b)=> (b.id||'').localeCompare(a.id||'')); PHOTO_LOG = loaded; }
  }catch(e){ /* stay in-memory */ }
}

  const checks = document.querySelectorAll(`.ex-check[data-panel="${panelKey}"]`);

  if(plateEl) renderPlateLoader(plateEl, percent);

  if(pctEl) pctEl.textContent = `${done} / ${total} done`;
}

/* ---- session timer ---- */
function startTimer(dayKey){
  if(DAY_TIMERS[dayKey] && DAY_TIMERS[dayKey].startTs) return;
  DAY_TIMERS[dayKey] = { startTs: Date.now(), intervalId: null };
  const btn = document.getElementById('start-btn-'+dayKey);
  if(btn){ btn.textContent = 'Running…'; btn.disabled = true; }
  DAY_TIMERS[dayKey].intervalId = setInterval(()=>updateTimerDisplay(dayKey), 1000);
  updateTimerDisplay(dayKey);
}
function updateTimerDisplay(dayKey){
  const state = DAY_TIMERS[dayKey];
  if(!state || !state.startTs) return;
  const elapsed = Date.now() - state.startTs;
  const mins = Math.floor(elapsed/60000);
  const secs = Math.floor((elapsed%60000)/1000);
  const disp = document.getElementById('timer-display-'+dayKey);
  if(disp) disp.textContent = String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
}
function stopTimerAndGetDuration(dayKey){
  const state = DAY_TIMERS[dayKey];
  if(!state || !state.startTs) return null;
  clearInterval(state.intervalId);
  const elapsedMs = Date.now() - state.startTs;
  DAY_TIMERS[dayKey] = { startTs:null, intervalId:null };
  const btn = document.getElementById('start-btn-'+dayKey);
  if(btn){ btn.textContent = 'Start Workout'; btn.disabled = false; }
  const disp = document.getElementById('timer-display-'+dayKey);
  if(disp) disp.textContent = '00:00';
  return Math.max(1, Math.round(elapsedMs/60000));
}

/* ---- rest timer (per exercise, reads its prescribed rest string) ---- */
function startRestTimer(btn, restStr){
  if(btn.dataset.running === '1') return;
  const match = restStr.match(/\d+/g);
  if(!match) return;
  let seconds = parseInt(match[match.length-1], 10); // use the upper bound, e.g. "60–90 sec" -> 90
  const original = btn.textContent;
  btn.dataset.running = '1';
  btn.classList.add('active');
  let iv = null;
  function tick(){
    btn.textContent = '⏱ '+seconds+'s';
    if(seconds<=0){
      if(iv) clearInterval(iv);
      btn.textContent = original;
      btn.classList.remove('active');
      btn.dataset.running = '0';
      return;
    }
    seconds--;
  }
  tick();
  iv = setInterval(tick, 1000);
}

/* ---- copy first set's weight down to empty sets for the same exercise ---- */
function copyFirstSet(dayKey, exIdx){
  const weightInputs = document.querySelectorAll(`.log-weight[data-day="${dayKey}"][data-ex="${exIdx}"]`);
  if(!weightInputs.length || !weightInputs[0].value) return;
  const firstVal = weightInputs[0].value;
  weightInputs.forEach(inp=>{ if(!inp.value) inp.value = firstVal; });
}

/* ---- save a logged session (sets/reps/weight + duration) ---- */
function saveSession(dayKey){
  const day = DAY_DATA[dayKey];
  const durationMin = stopTimerAndGetDuration(dayKey);
  const dateEl = document.getElementById('log-date-'+dayKey);
  const dateVal = (dateEl && dateEl.value) ? dateEl.value : TODAY_STR;
  const entries = [];
  day.exercises.forEach((ex, idx)=>{
    for(let s=0; s<ex.sets; s++){
      const wEl = document.querySelector(`.log-weight[data-day="${dayKey}"][data-ex="${idx}"][data-set="${s}"]`);
      const rEl = document.querySelector(`.log-reps[data-day="${dayKey}"][data-ex="${idx}"][data-set="${s}"]`);
      const w = wEl ? wEl.value.trim() : '';
      const r = rEl ? rEl.value.trim() : '';
      if(w || r){ entries.push({exercise: ex.name, set: s+1, weight: w || '—', reps: r || '—'}); }
    }
  });
  if(!entries.length){
    alert('Log at least one set (weight or reps) before saving.');
    return;
  }
  const session = {
    id: 'sess-'+Date.now(),
    date: dateVal,
    dayKey: dayKey,
    dayTitle: day.title+' — '+day.subtitle,
    duration: durationMin!=null ? durationMin+' min' : '—',
    entries: entries,
  };
  SESSION_LOG.unshift(session);
  storageSet('workout-sessions', SESSION_LOG);
  document.querySelectorAll(`.log-weight[data-day="${dayKey}"], .log-reps[data-day="${dayKey}"]`).forEach(i=>i.value='');
  renderSessionHistory();
  showToast(entries.length+' sets saved to your workout log.');
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast'; t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimeout);
  window.__toastTimeout = setTimeout(()=>t.classList.remove('show'), 2800);
}

function macroTargets(bw){
  const protein = Math.round(2.15*bw);
  const fat = Math.round(1.0*bw);
  const carb = Math.round(6.0*bw);
  const kcal = Math.round(protein*4 + carb*4 + fat*9);
  return {protein,fat,carb,kcal};
}

function libCardsHTML(muscleKey){
  return EXERCISE_LIBRARY[muscleKey].exercises.map((ex,idx)=>`
    <div class="lib-card" data-muscle="${muscleKey}" data-exidx="${idx}" data-name="${ex.name.toLowerCase()}" data-equip="${ex.equip.toLowerCase()}">
      <div class="lib-card-head">
        <div>
          <div class="lib-ex-name">${ex.name}</div>
          <div class="lib-ex-equip">${ex.equip}</div>
        </div>
        <div class="lib-card-actions">
          <button type="button" class="btn ghost small" onclick="copyFirstSetLib('${muscleKey}',${idx})">Same wt ↓</button>
          <button type="button" class="btn ghost small" onclick="addSetRow('${muscleKey}',${idx})">+ Add Set</button>
        </div>
      </div>
      <div class="lib-set-rows" id="rows-${muscleKey}-${idx}">
        ${setRowHTML(muscleKey,idx,0)}${setRowHTML(muscleKey,idx,1)}
      </div>
    </div>`).join('');
}
function setRowHTML(muscleKey, exIdx, rowIdx){
  return `<div class="lib-set-row" data-row="${rowIdx}">
    <span class="lib-set-num">Set ${rowIdx+1}</span>
    <input type="number" inputmode="decimal" placeholder="kg" class="lib-weight" data-muscle="${muscleKey}" data-exidx="${exIdx}" data-row="${rowIdx}">
    <input type="number" inputmode="numeric" placeholder="reps" class="lib-reps" data-muscle="${muscleKey}" data-exidx="${exIdx}" data-row="${rowIdx}">
  </div>`;
}
function addSetRow(muscleKey, exIdx){
  const container = document.getElementById(`rows-${muscleKey}-${exIdx}`);
  if(!container) return;
  const idx = container.children.length;
  container.insertAdjacentHTML('beforeend', setRowHTML(muscleKey, exIdx, idx));
}
function copyFirstSetLib(muscleKey, exIdx){
  const weightInputs = document.querySelectorAll(`.lib-weight[data-muscle="${muscleKey}"][data-exidx="${exIdx}"]`);
  if(!weightInputs.length || !weightInputs[0].value) return;
  const v = weightInputs[0].value;
  weightInputs.forEach(i=>{ if(!i.value) i.value = v; });
}
function selectMuscle(key){
  ACTIVE_MUSCLE = key;
  document.querySelectorAll('.muscle-pill').forEach(p=>p.classList.toggle('active', p.dataset.muscle===key));
  document.querySelectorAll('.lib-muscle-panel').forEach(p=>p.classList.toggle('active', p.id==='lib-panel-'+key));
}
function toggleEquipFilter(equip){
  if(ACTIVE_EQUIP.has(equip)) ACTIVE_EQUIP.delete(equip); else ACTIVE_EQUIP.add(equip);
  document.querySelectorAll('.equip-chip').forEach(c=>c.classList.toggle('active', ACTIVE_EQUIP.has(c.dataset.equip)));
  filterLibrary();
}
function filterLibrary(){
  const q = (document.getElementById('libSearch').value||'').toLowerCase().trim();
  document.querySelectorAll('.lib-card').forEach(card=>{
    const name = card.dataset.name, equip = card.dataset.equip;
    const matchesText = !q || name.includes(q) || equip.includes(q);
    const matchesEquip = ACTIVE_EQUIP.size===0 || [...ACTIVE_EQUIP].some(e=> equip.includes(e.toLowerCase()));
    card.style.display = (matchesText && matchesEquip) ? '' : 'none';
  });
}

/* ---- shared rest timer ---- */
let restTimerInterval = null;
function startSharedRest(seconds){
  clearInterval(restTimerInterval);
  let remaining = seconds;
  const disp = document.getElementById('shared-rest-display');
  document.querySelectorAll('.rest-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('rest-btn-'+seconds);
  if(btn) btn.classList.add('active');
  function tick(){
    if(disp) disp.textContent = String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
    if(remaining<=0){
      clearInterval(restTimerInterval);
      if(btn) btn.classList.remove('active');
      showToast('Rest complete — next set.');
      return;
    }
    remaining--;
  }
  tick();
  restTimerInterval = setInterval(tick, 1000);
}

/* ---- save a workout logged from the exercise library ---- */
function saveLibrarySession(){
  const durationMin = stopTimerAndGetDuration('lib');
  const dateEl = document.getElementById('log-date-lib');
  const dateVal = (dateEl && dateEl.value) ? dateEl.value : TODAY_STR;
  const entries = [];
  document.querySelectorAll('.lib-card').forEach(card=>{
    const muscleKey = card.dataset.muscle;
    const exIdx = parseInt(card.dataset.exidx, 10);
    const ex = EXERCISE_LIBRARY[muscleKey].exercises[exIdx];
    card.querySelectorAll('.lib-set-row').forEach((row,rIdx)=>{
      const wEl = row.querySelector('.lib-weight');
      const rEl = row.querySelector('.lib-reps');
      const w = wEl.value.trim(), r = rEl.value.trim();
      if(w || r){ entries.push({exercise: ex.name, muscle: EXERCISE_LIBRARY[muscleKey].label, set: rIdx+1, weight: w||'—', reps: r||'—'}); }
    });
  });
  if(!entries.length){ alert('Log at least one set before saving.'); return; }
  const muscleList = [...new Set(entries.map(e=>e.muscle))].join(' + ');
  const session = {
    id:'sess-'+Date.now(), date: dateVal, dayKey:'custom',
    dayTitle: muscleList, duration: durationMin!=null ? durationMin+' min' : '—', entries,
  };
  SESSION_LOG.unshift(session);
  storageSet('workout-sessions', SESSION_LOG);
  document.querySelectorAll('.lib-weight, .lib-reps').forEach(i=>i.value='');
  renderSessionHistory();
  showToast(entries.length+' sets saved — '+muscleList+'.');
}

/* ---- body weight trend chart (inline SVG, no dependency) ---- */
function renderWeightChart(){
  const wrap = document.getElementById('weightChartWrap');
  if(!wrap) return;
  const pts = TRACKER_ENTRIES
    .filter(e=> e.weight && e.weight!=='—' && !isNaN(parseFloat(e.weight)) && e.date)
    .map(e=>({date:e.date, w:parseFloat(e.weight)}))
    .sort((a,b)=> a.date.localeCompare(b.date));
  if(pts.length < 2){
    wrap.innerHTML = `<div class="empty-state">Log your weight at least twice (in Body Stats below) to see a trend line here.</div>`;
    return;
  }
  const W=680,H=200,pad=34;
  const weights = pts.map(p=>p.w);
  const minW = Math.min(...weights)-0.5, maxW = Math.max(...weights)+0.5;
  const xStep = pts.length>1 ? (W-pad*2)/(pts.length-1) : 0;
  const coords = pts.map((p,i)=>{
    const x = pad + i*xStep;
    const y = H-pad - ((p.w-minW)/(maxW-minW))*(H-pad*2);
    return [x,y];
  });
  const dots = coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="4" fill="#FF6B4A"><title>${pts[i].date}: ${pts[i].w}kg</title></circle>`).join('');
  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <polyline points="${coords.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ')}" fill="none" stroke="#FF6B4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      <text x="${pad}" y="${H-10}" fill="#9A9284" font-size="10" font-family="Plus Jakarta Sans, sans-serif" font-weight="600">${pts[0].date}</text>
      <text x="${W-pad}" y="${H-10}" fill="#9A9284" font-size="10" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" text-anchor="end">${pts[pts.length-1].date}</text>
      <text x="${pad}" y="16" fill="#6F695F" font-size="11" font-family="Plus Jakarta Sans, sans-serif" font-weight="700">${maxW.toFixed(1)} kg</text>
      <text x="${pad}" y="${H-pad+6}" fill="#6F695F" font-size="11" font-family="Plus Jakarta Sans, sans-serif" font-weight="700">${minW.toFixed(1)} kg</text>
    </svg>`;
}

/* ---- weekly progress photos (compressed client-side, stored per-key) ---- */
function handlePhotoUpload(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 800;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      const tagEl = document.getElementById('photoTag');
      const dateEl = document.getElementById('photoDate');
      const entry = {
        id: 'photo-'+Date.now(),
        date: (dateEl && dateEl.value) || TODAY_STR,
        tag: (tagEl && tagEl.value) || 'Front',
        dataUrl: dataUrl,
      };
      PHOTO_LOG.unshift(entry);
      storageSet('photo:'+entry.id, entry);
      renderPhotoGallery();
      inputEl.value = '';
      showToast('Photo added to your progress log.');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function renderPhotoGallery(){
  const wrap = document.getElementById('photoGalleryWrap');
  if(!wrap) return;
  if(!PHOTO_LOG.length){
    wrap.innerHTML = `<div class="empty-state">No photos yet. Add one every week (same pose, same lighting) to see real progress.</div>`;
    return;
  }
  wrap.innerHTML = `<div class="photo-gallery">${PHOTO_LOG.map(p=>`
    <div class="photo-card">
      <img src="${p.dataUrl}" alt="Progress photo ${p.date}">
      <div class="photo-card-meta">
        <div>${p.date} · ${p.tag}</div>
        <div class="photo-card-actions">
          <a href="${p.dataUrl}" download="progress-${p.date}-${p.tag}.jpg">Save</a>
          <button type="button" onclick="deletePhoto('${p.id}')">Delete</button>
        </div>
      </div>
    </div>`).join('')}</div>`;
}
function deletePhoto(id){
  PHOTO_LOG = PHOTO_LOG.filter(p=>p.id!==id);
  storageDelete('photo:'+id);
  renderPhotoGallery();
}

function addWater(ml){
  WATER_ML = Math.max(0, WATER_ML+ml);
  renderWater();
}
function renderWater(){
  const pct = Math.min(100, Math.round((WATER_ML/WATER_TARGET)*100));
  const fillEl = document.getElementById('waterFillInner');
  if(fillEl) fillEl.style.height = pct+'%';
  const lbl = document.getElementById('waterLabel');
  if(lbl) lbl.textContent = `${WATER_ML} / ${WATER_TARGET} ml`;
}

function addEntry(){
  const entry = {
    date: document.getElementById('tDate').value || new Date().toISOString().slice(0,10),
    weight: document.getElementById('tWeight').value || '—',
    chest: document.getElementById('tChest').value || '—',
    waist: document.getElementById('tWaist').value || '—',
    arm: document.getElementById('tArm').value || '—',
    sleep: document.getElementById('tSleep').value || '—',
    energy: document.getElementById('tEnergy').value || '—',
    done: document.getElementById('tDone').value,
    notes: document.getElementById('tNotes').value || '',
  };
  TRACKER_ENTRIES.unshift(entry);
  storageSet('body-log', TRACKER_ENTRIES);
  renderTrackerTable();
  renderWeightChart();
  document.getElementById('tNotes').value='';
}

function clearEntries(){
  if(TRACKER_ENTRIES.length && !confirm('Clear all logged entries? Export first if you want to keep them.')) return;
  TRACKER_ENTRIES = [];
  storageSet('body-log', TRACKER_ENTRIES);
  renderTrackerTable();
  renderWeightChart();
}

function renderTrackerTable(){
  const wrap = document.getElementById('trackerTableWrap');
  if(!wrap) return;
  if(!TRACKER_ENTRIES.length){
    wrap.innerHTML = `<div class="empty-state">No entries yet. Add today's numbers above — even just weight and sleep is useful over time.</div>`;
    return;
  }
  const rows = TRACKER_ENTRIES.map(e=>`
    <tr>
      <td class="mono">${e.date}</td><td class="mono">${e.weight}</td><td class="mono">${e.chest}</td>
      <td class="mono">${e.waist}</td><td class="mono">${e.arm}</td><td class="mono">${e.sleep}</td>
      <td class="mono">${e.energy}</td><td>${e.done}</td><td class="ex-notes">${e.notes}</td>
    </tr>`).join('');
  wrap.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Wt(kg)</th><th>Chest</th><th>Waist</th><th>Arm</th><th>Sleep</th><th>Energy</th><th>Done</th><th>Notes</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function exportCSV(){
  if(!TRACKER_ENTRIES.length){ alert('No entries to export yet.'); return; }
  const header = ['Date','Weight(kg)','Chest(cm)','Waist(cm)','Arm(cm)','Sleep(hrs)','Energy','WorkoutDone','Notes'];
  const rows = TRACKER_ENTRIES.map(e=>[e.date,e.weight,e.chest,e.waist,e.arm,e.sleep,e.energy,e.done,`"${(e.notes||'').replace(/"/g,'""')}"`]);
  const csv = [header.join(','), ...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `progress-log-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderSessionHistory(){
  const wrap = document.getElementById('sessionHistoryWrap');
  if(!wrap) return;
  if(!SESSION_LOG.length){
    wrap.innerHTML = `<div class="empty-state">No sessions logged yet. Open any gym day, expand "Log This Session," and hit Save Session once you're done.</div>`;
    return;
  }
  const rows = SESSION_LOG.map(sess=>{
    const details = sess.entries.map(e=>`${e.exercise} — Set ${e.set}: ${e.weight} kg × ${e.reps}`).join('<br>');
    return `<tr>
      <td class="mono">${sess.date}</td>
      <td class="ex-name">${sess.dayTitle}</td>
      <td class="mono">${sess.duration}</td>
      <td class="ex-notes">${details}</td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Session</th><th>Duration</th><th>Sets Logged</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function clearSessions(){
  if(SESSION_LOG.length && !confirm('Clear all workout session logs? Export first if you want to keep them.')) return;
  SESSION_LOG = [];
  storageSet('workout-sessions', SESSION_LOG);
  renderSessionHistory();
}

function exportWorkoutCSV(){
  if(!SESSION_LOG.length){ alert('No sessions to export yet.'); return; }
  const header = ['Date','Session','Duration','Exercise','Set','Weight(kg)','Reps'];
  const rows = [];
  SESSION_LOG.forEach(sess=>{
    sess.entries.forEach(e=>{
      rows.push([sess.date, `"${sess.dayTitle}"`, sess.duration, `"${e.exercise}"`, e.set, e.weight, e.reps]);
    });
  });
  const csv = [header.join(','), ...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `workout-log-${TODAY_STR}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function buildNav(){
  const navEl = document.getElementById('nav');
  navEl.innerHTML = NAV.map(g=>`
    <div class="nav-group">
      <div class="nav-title">${g.group}</div>
      ${g.items.map(it=>`
        <button class="nav-link" data-target="${it.id}">
          <span class="nav-num">${it.num}</span>
          <span>${it.label}</span>
        </button>`).join('')}
    </div>`).join('');

  navEl.querySelectorAll('.nav-link').forEach(btn=>{
    btn.addEventListener('click', ()=> showPanel(btn.dataset.target));
  });
}

function showPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active', b.dataset.target===id));
  const label = document.querySelector(`.nav-link[data-target="${id}"] span:last-child`);
  document.getElementById('topbarTitle').textContent = label ? label.textContent : 'The Build';
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  window.scrollTo(0,0);
}

function setupMobileNav(){
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const toggle = document.getElementById('menuToggle');
  toggle.addEventListener('click', ()=>{
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', ()=>{
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });
}

async function init(){
  buildNav();
  buildOverview();
  buildSchedule();
  buildDayPanels();

  buildMorning();
  buildPrinciples();
  buildNutrition();
  await loadPersisted();
  buildTracker();
  setupMobileNav();
  showPanel('overview');
}
document.addEventListener('DOMContentLoaded', init);
</script>
